;; ==============================================================================
;; Kanganheri Darpan — PgBouncer Connection Pooler Configuration
;; Optimized for PostgreSQL 16 + Prisma Connection Pooling in Transaction Mode
;; ==============================================================================

[databases]
;; Direct database target with credentials resolved through userlist.txt or env
kanganheri_db = host=postgres port=5432 dbname=kanganheri_db auth_user=kanganheri_app

[pgbouncer]
;; Network configuration
listen_addr = 0.0.0.0
listen_port = 6432
unix_socket_dir = /tmp

;; Authentication
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt

;; Connection Pool Settings
;; 'transaction' pool mode is required for high-concurrency micro-transactions with Prisma
pool_mode = transaction
max_client_conn = 500
default_pool_size = 20
min_pool_size = 5
reserve_pool_size = 5
reserve_pool_timeout = 5
max_db_connections = 50

;; Timeouts (in seconds)
server_idle_timeout = 600
server_connect_timeout = 15
server_login_retry = 5
client_idle_timeout = 0
client_login_timeout = 30
query_timeout = 60
query_wait_timeout = 120

;; Logging & Diagnostics
log_connections = 1
log_disconnections = 1
log_pooler_errors = 1
stats_period = 60
verbose = 0
