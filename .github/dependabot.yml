# ==============================================================================
# Kanganheri Darpan (कांगनहेड़ी दर्पण) — Dependabot Configuration
# Weekly Dependency and Security Scanning for NPM, Docker & GitHub Actions
# ==============================================================================

version: 2
updates:
  # Maintain NPM packages
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "security"
      - "javascript"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  # Maintain Dockerfile base images
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:30"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "security"
      - "docker"
    commit-message:
      prefix: "chore(docker)"
      include: "scope"

  # Maintain GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "first-day"
      time: "05:00"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci-cd"
    commit-message:
      prefix: "ci(actions)"
      include: "scope"
